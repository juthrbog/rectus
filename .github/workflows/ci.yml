name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Check the version
        run: scripts/check-version.sh

      - name: Check the JavaScript syntax
        run: for f in src/*.js test/*.js; do node --check "$f"; done

      - name: Test
        run: node --test test/*.test.js

      - name: Check the shell scripts
        run: shellcheck packaging/rectus.sh scripts/*.sh

      # Rectus supports only Arch Linux. In an Arch Linux container, this step
      # builds the package from the commit, checks it with namcap, installs
      # it with electron44 and runs "rectus --self-test".
      - name: Build, install and run the package
        run: scripts/ci-container.sh HEAD "$(node -p 'require("./package.json").version')" dist
