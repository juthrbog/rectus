name: Release

on:
  push:
    tags:
      - "v*"
  # A change to the release setup runs a snapshot: it builds, checks,
  # installs and runs the package, but publishes nothing.
  pull_request:
    paths:
      - ".github/release.yml"
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag publishes a package, so the code must pass the same checks as CI
  # first. The tag must match the version in package.json and PKGBUILD.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache in release builds, so a poisoned cache cannot reach them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Check the version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$TAG" ]]; then
            scripts/check-version.sh "$TAG"
          else
            scripts/check-version.sh
          fi

      - name: Test
        run: node --test test/*.test.js

      - name: Check the shell scripts
        run: shellcheck packaging/rectus.sh scripts/*.sh

  # Builds the package on Arch Linux, checks it with namcap, installs it with
  # electron44 and runs "rectus --self-test".
  build:
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git nodejs namcap \
            desktop-file-utils xorg-server-xvfb

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build, install and run the package
        env:
          REF: ${{ github.ref_type == 'tag' && github.ref_name || 'HEAD' }}
        run: |
          git config --global --add safe.directory "$PWD"
          scripts/ci-package.sh "$REF" "$(node -p 'require("./package.json").version')" release

      # .SRCINFO is a hidden file. The AUR job needs it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Write checksums
        working-directory: release
        run: sha256sum rectus-*.tar.gz rectus-*.pkg.tar.zst PKGBUILD > checksums.txt

      # Users can check where a file came from with
      # "gh attestation verify <file> --repo juthrbog/rectus".
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/checksums.txt

      # The release notes list the pull requests since the last release.
      # A tag such as v0.3.0-rc.1 makes a prerelease.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            release/rectus-*.tar.gz release/rectus-*.pkg.tar.zst \
            release/PKGBUILD release/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"

  # The AUR gets the new PKGBUILD through the SSH key of the AUR account
  # that maintains the package. Its private key is the AUR_SSH_KEY secret
  # of this repository.
  aur:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check the AUR setup
        id: aur
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Prerelease: the AUR package stays unchanged.'
          elif [[ -z "$AUR_SSH_KEY" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::AUR publication skipped. Set the AUR_SSH_KEY secret.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.aur.outputs.enabled == 'true'
        with:
          name: release
          path: release

      # The host key is the ED25519 key that aur.archlinux.org publishes
      # (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
      - name: Set up SSH for the AUR
        if: steps.aur.outputs.enabled == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Update the AUR package
        if: steps.aur.outputs.enabled == 'true'
        run: |
          git clone ssh://aur@aur.archlinux.org/rectus.git .aur
          cp release/PKGBUILD release/.SRCINFO .aur/
          git -C .aur config user.name 'github-actions[bot]'
          git -C .aur config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .aur add PKGBUILD .SRCINFO
          if ! git -C .aur diff --cached --quiet; then
            git -C .aur commit -m "Update to $GITHUB_REF_NAME"
            git -C .aur push origin HEAD:master
          fi
