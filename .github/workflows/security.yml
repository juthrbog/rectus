name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC, so new advisories show up without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: SCA & Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by SHA because of the March 2026 tag hijack of this action.
      # exit-code fails the job on a CRITICAL or HIGH finding.
      # limit-severities-for-sarif keeps the severity filter for SARIF output.
      # Without it the action drops the filter, and exit-code also fails on LOW findings.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif

      # always() uploads the SARIF report also when trivy fails the job.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-results.sarif

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
